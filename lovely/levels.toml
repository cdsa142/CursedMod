[manifest]
version = "1.0.0"
priority = 0

# Add the levels scripts
[[patches]]
[patches.copy]
target = "main.lua"
position = "prepend"
sources = [
    "addLevels.lua"
]

# Add levels to the map list
[[patches]]
[patches.pattern]
target = "menu.lua"
pattern = "local map_files = love.filesystem.getDirectoryItems(\"res/maps\")"
position = "after"
payload = '''
print("adding levels.")
local newLevels = love.filesystem.getDirectoryItems("CursedMod/CursedMod/res/maps")
table.move(newLevels, 1, #newLevels, #map_files + 1, map_files)
'''
match_indent = true

# When a level cannot be found in the base game, assume it's from CursedMod
# TODO: find a better way to determine the file location, or merge mod maps into res/maps
[[patches]]
[patches.pattern]
target = "menu.lua"
pattern = '''
local item = LevelData.newMetadataOnly("res/maps/"..map_files[i]).metadata
item.file = "res/maps/"..map_files[i]
'''
position = "at"
payload = '''
local fileDir = "res/maps/"
if not love.filesystem.getInfo(fileDir .. map_files[i]) then
    print("found a cursed map")
    fileDir = "CursedMod/CursedMod/res/maps/"
end
local item = LevelData.newMetadataOnly(fileDir..map_files[i]).metadata
item.file = fileDir..map_files[i]
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "leveldata.lua"
pattern = 'if line[3] == "money" or line[3] == "money_door" then'
position = "at"
payload = 'if line[3] == "money" or line[3] == "money_door" or line[3] == "pay_spike" then'
match_indent = true
